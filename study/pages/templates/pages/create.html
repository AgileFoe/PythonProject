{% extends 'main/layout.html' %}

{% block title %}form{% endblock %}

{% block content %}
    <div class="features">
        <h3>Form</h3>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.title }}<br>
            {{ form.anons }}<br>
            {{ form.full_text }}<br>
            {{ form.image }}<br>
            <span>{{ error }}</span>

            <button class="btn btn-info" type="submit">add text</button>
        </form>
    </div>
{% endblock %}
