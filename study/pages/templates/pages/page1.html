{% extends 'main/layout.html' %}

{% block title %}main{% endblock %}

{% block content %}
    <div class="features">
        <h1>NEWS</h1>
        {% if news %}
            {% for el in news %}
                <div class="alert alert-warning ">
                    <h3>{{ el.title }}</h3>
                    <p>{{ el.anons }}</p>
                    <a href="{% url 'detail' el.id %}" class="btn btn-warning">more...</a>

                </div>
            {% endfor %}
        {% else %}
            <p>NOTHING</p>
        {% endif %}
    </div>
{% endblock %}
