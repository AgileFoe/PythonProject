{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'main/css/main.css' %}">

</head>
<body>

    <aside>
        <span class="image">Welcome!</span>
        <p>‎ </p>

            <a href="{% url 'page1' %}"><li><i class="fa-solid fa-archway"></i> News </li></a>
            <a href="{% url 'about' %}"><li><i class="fa-solid fa-baby"></i> About </li></a>

            <a href="{% url 'create' %}"><li><button class="btn btn-info"><i class="fas fa-plus-circle"></i> add news</li></a>

    <main>
        {% block content %}
        {% endblock %}
    </main>

</html>
