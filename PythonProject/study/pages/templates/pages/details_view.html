{% extends 'main/layout.html' %}

{% block title %}{{ article.title }}{% endblock %}

{% block content %}
    <div class="features">
        <h1>{{ article.title }}</h1>
        <p>{{ article.anons }}</p>
        <p>{{ article.full_text }}</p>
        <a href="{% url 'delete' article.id %}" class="btn btn-danger">delete</a>
        <a href="{% url 'update' article.id %}" class="btn btn-info">edit</a>
        <img src="{{ object.img.png }}" alt="">

    </div>
{% endblock %}
